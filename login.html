<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Logbook - Login</title>
    <style>
        /* Include your root variables and base body/container styles here */
        :root {
            --bg-color: #EEF2FB;
            --primary-blue: #D9E2FC;
            --primary-blue-text: #5A7BFA;
            --card-bg: #FFFFFF;
            --text-muted: #718096;
        }
        body {
            background-color: var(--bg-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; font-family: sans-serif;
        }
        .container { width: 100%; max-width: 400px; }
        .header-section { text-align: center; margin-bottom: 20px; }
        .portal-badge { background: var(--primary-blue); color: var(--primary-blue-text); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; }
        #login-btn { background-color: var(--primary-blue-text); color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        p.subtitle { color: var(--text-muted); font-size: 12px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="portal-badge">⚡ EE COMPUTER LABORATORY PORTAL</div>
            <h1>Digital Logbook</h1>
            <p class="subtitle">Federation of United Students of Electrical Engineering</p>
        </div>

        <div id="login-screen" class="card">
            <button id="login-btn">Sign in with @addu.edu.ph</button>
            <p id="login-error" style="color: red; font-size: 14px; margin-top: 10px; text-align: center;"></p>
        </div>
    </div>
    <!-- Point this to a JS file that ONLY handles authentication/redirects -->
    <script type="module" src="login.js"></script> 
</body>
</html>
