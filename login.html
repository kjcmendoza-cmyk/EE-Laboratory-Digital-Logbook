<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDU Lab | Login</title>
    <style>
        :root {
            --primary: #003366; /* Ateneo Blue */
            --bg: #f4f7f6;
            --text: #333;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: var(--text);
        }
        .container {
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
        }
        h2 { margin-top: 0; color: var(--primary); }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        button { 
            background-color: var(--primary); 
            color: white; 
            cursor: pointer; 
            border: none; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        button:hover { background-color: #002244; }
        .hidden { display: none; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <!-- LOGIN CARD -->
    <div class="container" id="loginCard">
        <h2>Lab Check-In System</h2>
        <p>Please log in using your ADDU Google Account.</p>
        <p class="error" id="loginError"></p>
        <button id="signInBtn">Sign in with @addu.edu.ph</button>
    </div>

    <!-- PROFILE SETUP CARD (Shown only on first login) -->
    <div class="container hidden" id="setupCard">
        <h2>Complete Profile</h2>
        <p>Please provide your student details.</p>
        <form id="setupForm">
            <input type="text" id="studentName" placeholder="Full Name" required readonly>
            <input type="text" id="studentId" placeholder="ID Number (e.g. 2023-1234)" required>
            <select id="yearLevel" required>
                <option value="" disabled selected>Select Year Level</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
                <option value="5th Year">5th Year</option>
            </select>
            <input type="text" id="program" placeholder="Program (e.g. BSCS, BSIT)" required>
            <button type="submit">Save & Continue</button>
        </form>
    </div>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        // Integrated Firebase Configuration 
        const firebaseConfig = {
            apiKey: "AIzaSyATXyz4bLskXvDHBAZrlbtg14e1_c12pPo",
            authDomain: "ee-laboratory-digital-logbook.firebaseapp.com",
            projectId: "ee-laboratory-digital-logbook",
            storageBucket: "ee-laboratory-digital-logbook.firebasestorage.app",
            messagingSenderId: "1065618016813",
            appId: "1:1065618016813:web:c579b08fa406ec449946a4",
            measurementId: "G-RT82Q2ZWPZ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Restrict Google Sign-In to @addu.edu.ph domain (optional security layer on client side)
        provider.setCustomParameters({ hd: "addu.edu.ph" });

        // DOM Elements
        const signInBtn = document.getElementById("signInBtn");
        const loginCard = document.getElementById("loginCard");
        const setupCard = document.getElementById("setupCard");
        const loginError = document.getElementById("loginError");
        const setupForm = document.getElementById("setupForm");

        let currentUser = null;

        // Automatically redirect if the user is already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Verify if the user already has a profile setup in Firestore
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    window.location.href = "student.html"; 
                }
            }
        });

        // Trigger Google Sign In
        signInBtn.addEventListener("click", async () => {
            try {
                loginError.style.display = "none";
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Verify email domain constraint
                if (!user.email.endsWith("@addu.edu.ph")) {
                    await auth.signOut();
                    loginError.textContent = "Please use your official @addu.edu.ph email.";
                    loginError.style.display = "block";
                    return;
                }

                // Check if user already exists in Firestore database
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    // Profile exists, redirect to dashboard
                    window.location.href = "student.html";
                } else {
                    // First time login - Show Profile Setup Form
                    currentUser = user;
                    document.getElementById("studentName").value = user.displayName || "";
                    loginCard.classList.add("hidden");
                    setupCard.classList.remove("hidden");
                }
            } catch (error) {
    console.error("Login Error:", error);
    // Displays the exact Firebase error message for easier debugging
    loginError.textContent = error.message || "Authentication failed. Please try again.";
    loginError.style.display = "block";
}
        });

        // Handle Profile Submission for new users
        setupForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            try {
                // Save the new user document to Firestore
                await setDoc(doc(db, "users", currentUser.uid), {
                    name: currentUser.displayName || document.getElementById("studentName").value,
                    email: currentUser.email,
                    studentId: document.getElementById("studentId").value,
                    yearLevel: document.getElementById("yearLevel").value,
                    program: document.getElementById("program").value,
                    createdAt: new Date()
                });

                // Redirect to the student dashboard upon successful save
                window.location.href = "student.html";
            } catch (error) {
                console.error("Profile saving error:", error);
                alert("Failed to save profile details. Please try again.");
            }
        });
    </script>
</body>
</html>
