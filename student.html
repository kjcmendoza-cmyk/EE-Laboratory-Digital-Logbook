<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Logbook - Dashboard</title>
    <style>
        /* Include ALL your styles from the original index.html here */
        :root {
            --bg-color: #EEF2FB; --text-main: #2D3748; --text-muted: #718096;
            --primary-blue: #D9E2FC; --primary-blue-text: #5A7BFA;
            --btn-green: #68D3A6; --btn-red: #FC8181; --card-bg: #FFFFFF;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-main); }
        .container { width: 100%; max-width: 400px; }
        .header-section { text-align: center; margin-bottom: 20px; }
        .portal-badge { background: var(--primary-blue); color: var(--primary-blue-text); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        h1 { margin: 5px 0; font-size: 24px; color: #1A202C; }
        p.subtitle { color: var(--text-muted); font-size: 12px; margin: 0; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .user-card { display: flex; justify-content: space-between; align-items: center; }
        .user-info-text { flex-grow: 1; padding-left: 15px; }
        .user-name { font-weight: bold; font-size: 16px; margin: 0; }
        .user-details { color: var(--primary-blue-text); font-size: 12px; margin: 0; }
        .logout-btn { background: #FEE2E2; color: #E53E3E; border: none; padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .status-area { text-align: center; }
        .status-label { font-size: 12px; font-weight: bold; color: var(--text-muted); letter-spacing: 1px; }
        .status-pill { display: inline-block; background: #EDF2F7; color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 15px 0; }
        .status-instruction { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .main-action-btn { width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.1s; }
        .main-action-btn:active { transform: scale(0.98); }
        .btn-checkin { background-color: var(--btn-green); }
        .btn-checkout { background-color: var(--btn-red); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 350px; text-align: center; }
        .purpose-btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .btn-lab { background-color: #4A90E2; } .btn-class { background-color: #F5A623; } .btn-rest { background-color: #9B9B9B; }
        .btn-cancel { background: none; color: var(--text-muted); border: none; margin-top: 10px; cursor: pointer; font-weight: bold;}
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; border-radius: 8px; color: white; font-weight: bold; display: none; z-index: 2000; }
        .toast.green { background-color: #28a745; display: block; }
        .toast.red { background-color: #D0021B; display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="toast-msg" class="toast"></div>

    <div class="container">
        <div class="header-section">
            <div class="portal-badge">⚡ EE COMPUTER LABORATORY PORTAL</div>
            <h1>Digital Logbook</h1>
            <p class="subtitle">Federation of United Students of Electrical Engineering</p>
        </div>

        <div id="app-screen">
            <div class="card user-card">
                <div class="user-info-text">
                    <p class="user-name">Hello, <span id="student-name">Student</span>!</p>
                    <p class="user-details">AdDU Student</p>
                </div>
                <button class="logout-btn" id="logout-btn">Log Out</button>
            </div>

            <div class="card status-area">
                <div class="status-label">CURRENT LABORATORY STATUS</div>
                <div id="status-display" class="status-pill">● CHECKED OUT</div>
                <p class="status-instruction">Tap below when entering or leaving</p>
                <button id="pre-checkin-btn" class="main-action-btn btn-checkin hidden">CHECK IN TO LABORATORY</button>
                <button id="checkout-btn" class="main-action-btn btn-checkout hidden">CHECK OUT OF LABORATORY</button>
            </div>
        </div>
    </div>

    <!-- PURPOSE SELECTION MODAL -->
    <div id="purpose-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Select Purpose</h3>
            <button class="purpose-btn btn-lab" data-purpose="Laboratory Work">🛠️ Laboratory Work</button>
            <button class="purpose-btn btn-class" data-purpose="Class">📚 Class</button>
            <button class="purpose-btn btn-rest" data-purpose="Review / Rest">☕ Review / Rest</button>
            <button id="close-modal-btn" class="btn-cancel">Cancel</button>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
