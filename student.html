<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDU Lab | Student Check-In</title>
    <style>
        :root {
            --primary: #003366; 
            --bg: #f4f7f6;
            --text: #333;
            --success: #28a745;
            --danger: #dc3545;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: var(--text);
            text-align: center;
        }
        .container {
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }
        .header { margin-bottom: 20px; }
        .header h2 { color: var(--primary); margin: 0 0 5px 0; }
        .user-info { font-size: 14px; color: #666; margin-bottom: 20px;}
        
        .hidden { display: none; }
        
        /* Check-In Buttons */
        .btn-purpose {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #fff;
            font-size: 18px;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-purpose:hover { border-color: var(--primary); background: #f0f8ff; }
        
        /* Check-Out Button */
        .btn-checkout {
            display: block;
            width: 100%;
            padding: 25px;
            margin: 20px 0;
            border: none;
            border-radius: 12px;
            background: var(--danger);
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.4);
            transition: transform 0.1s;
        }
        .btn-checkout:active { transform: scale(0.98); }

        /* Notification Banner */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .notif-green { background-color: var(--success); }
        .notif-red { background-color: var(--danger); }
        .show-notif { opacity: 1; }
        
        .logout { margin-top: 20px; font-size: 14px; color: #888; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div class="notification" id="notifBanner">Status Updated</div>

    <div class="container">
        <div class="header">
            <h2>EE Laboratory</h2>
            <div class="user-info" id="userInfo">Loading profile...</div>
        </div>

        <!-- VIEW: OUTSIDE (Requires Check-In) -->
        <div id="checkInView" class="hidden">
            <p>Select your purpose of entry:</p>
            <button class="btn-purpose" data-purpose="Laboratory Work">🛠️ Laboratory Work</button>
            <button class="btn-purpose" data-purpose="Class">📚 Class</button>
            <button class="btn-purpose" data-purpose="Review / Rest">☕ Review / Rest</button>
        </div>

        <!-- VIEW: INSIDE (Requires Check-Out) -->
        <div id="checkOutView" class="hidden">
            <p>You are currently checked in for: <br><strong id="currentPurpose">...</strong></p>
            <button class="btn-checkout" id="checkOutBtn">Tap to Check Out</button>
        </div>

        <div class="logout" id="logoutBtn">Sign Out</div>
    </div>

    <!-- External Script -->
    <script type="module" src="student.js"></script>
</body>
</html>
