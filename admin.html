<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDU Lab | Admin Dashboard</title>
    <style>
        :root {
            --primary: #003366; 
            --bg: #f4f7f6;
            --text: #333;
            --danger: #dc3545;
            --warning: #ffc107;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px;
            color: var(--text);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; color: var(--primary); }
        .stats { font-size: 18px; font-weight: bold; background: #e9ecef; padding: 10px 20px; border-radius: 8px; }
        
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
        }
        tr:hover { background-color: #f9f9f9; }
        
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #e1f5fe;
            color: #0277bd;
        }
        
        .btn-override {
            background-color: var(--warning);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-override:hover { background-color: #e0a800; }
        
        .logout { color: var(--danger); cursor: pointer; font-weight: bold; text-decoration: none; }
        .empty-state { text-align: center; padding: 40px; color: #888; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Lab In-Charge Dashboard</h1>
        <div class="stats">Live Headcount: <span id="headcount">0</span></div>
        <a class="logout" id="logoutBtn">Sign Out</a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Email</th>
                    <th>Time Entered</th>
                    <th>Purpose</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="rosterBody">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
    </div>

    <!-- External Script -->
    <script type="module" src="admin.js"></script>
</body>
</html>
